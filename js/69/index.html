<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map-Wiki</title>

    <style>
        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-columns: 1fr 3fr;
        }

        .marker-image {
            width: 32px;
        }

        #sidebar {
            border-right: 1px solid black;
            height: 100%;
            overflow: auto;
        }

        #sidebar img {
            width: 32px;
        }

        #places {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #places li {
            margin-top: 1em;
            border: 1px solid black;
            border-radius: 8px;
            cursor: pointer;
        }

        .info {
            display: flex;
            gap: 1em;
            padding: 0.5em 1em;
        }

        .info span {
            flex: 1;
            margin: auto;
        }
    </style>











    <div id="sidebar">
        <form id="searchForm">
            <input id="search" type="text" required />
            <button>search</button>
        </form>
        <hr />
        <ul id="places"></ul>
    </div>
    <div id="map"></div>
