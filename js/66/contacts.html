<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: auto;
    }

    th,
    td {
      border: 1px solid black;
      padding: 0.5em;
    }

    .form-group label {
      display: inline-block;
      width: 3em;
    }

    .form-group {
      margin-bottom: 0.5em;
    }

    #addContact {
      display: none;

      background-color: lightcyan;
      border: 1px solid black;
      padding: 1em;
      height: 8.5em;
      width: 15em;

      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -4.25em;
      margin-left: -7.5em;
    }

    #add,
    #load {
      margin-top: 1em;
    }
  </style>
</head>

<body>
  <table id="contactsTable">
    <thead>
      <tr>
        <th>first</th>
        <th>last</th>
        <th>email</th>
        <th>phone</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="5">no contacts loaded</td>
      </tr>
    </tbody>
  </table>

  <button id="add">add contact</button>

  <button id="load">load contacts</button> <!-- ------ HW66 -->

  <form id="addContact">
    <div class="form-group">
      <label for="first">first:</label>
      <input id="first" />
    </div>
    <div class="form-group">
      <label for="last">last:</label>
      <input id="last" required />
    </div>
    <div class="form-group">
      <label for="email">email:</label>
      <input id="email" />
    </div>
    <div class="form-group">
      <label for="phone">phone:</label>
      <input id="phone" />
    </div>
    <button>add</button>
    <button type="reset">reset</button>
    <button type="button" id="cancel">cancel</button>
  </form>
  <script src="contacts.js" type="module"></script>
</body>

</html>
