<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #1e1e2e;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  #theCanvas {
    display: block;
  }

  #ball-color-picker,
  #ball-size-picker,
  #ball-adder {
    position: absolute;
    left: 15px;
    width: 220px;
    height: 44px;
    padding: 0 12px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  #ball-color-picker {
    top: 15px;
  }

  #ball-size-picker {
    top: 67px;
  }

  #ball-adder {
    top: 119px;
    padding: 0;
    background: none;
  }

  #ball-size {
    width: 55px;
    padding: 4px;
  }

  #add-ball {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }

  #add-ball:hover {
    background: #4338ca;
  }
</style>

    </style>
  </head>
  <body>
    <canvas id="theCanvas"></canvas>

    <div id="ball-color-picker">
      <label>Choose ball color:</label>
      <input type="color" id="ball-color" name="ball-color" value="#ff0000">
    </div>

    <div id="ball-size-picker">
      <label>Choose ball size:</label>
      <input type="number" id="ball-size" name="ball-size" value="50">
    </div>
  
    <div id="ball-adder">
      <button id="add-ball">Add Ball</button>
    </div>

    <script src="ball.js" type="module"></script>
  </body>
</html>
